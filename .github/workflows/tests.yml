name: tests
on: [pull_request]
permissions:
  contents: read
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install deps
        run: npm ci
      - name: test collections
        run: npm run test
